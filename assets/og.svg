<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2228"/>
      <stop offset="1" stop-color="#16191E"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49C46D"/>
      <stop offset="1" stop-color="#7AE092"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="55%">
      <stop offset="0" stop-color="#49C46D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#49C46D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- logo -->
  <g transform="translate(80,72)">
    <rect width="64" height="64" rx="15" fill="url(#grn)"/>
    <text x="32" y="46" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#0F1A14" text-anchor="middle">B</text>
    <text x="84" y="44" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">BuyVM</text>
    <text x="84" y="44" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff"></text>
  </g>
  <text x="80" y="270" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="800" fill="#fff" letter-spacing="-2">Servers from</text>
  <text x="80" y="360" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#grn)" letter-spacing="-2">$2 a month.</text>
  <text x="80" y="430" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="500" fill="#B8BBC0">Full-root KVM VPS · 1 Gbps unmetered · DDoS · since 2010</text>
  <!-- chips -->
  <g font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">
    <rect x="80" y="478" width="230" height="54" rx="27" fill="#282B30" stroke="#49C46D" stroke-opacity="0.4"/>
    <text x="195" y="513" fill="#7AE092" text-anchor="middle">1 Gbps unmetered</text>
    <rect x="326" y="478" width="200" height="54" rx="27" fill="#282B30" stroke="#49C46D" stroke-opacity="0.4"/>
    <text x="426" y="513" fill="#7AE092" text-anchor="middle">3.5 Tbps DDoS</text>
    <rect x="542" y="478" width="250" height="54" rx="27" fill="#282B30" stroke="#49C46D" stroke-opacity="0.4"/>
    <text x="667" y="513" fill="#7AE092" text-anchor="middle">100+ OS templates</text>
  </g>
  <!-- a Cloudzy company -->
  <g transform="translate(80,576)" font-family="Inter,Arial,sans-serif">
    <rect x="0" y="-2" width="30" height="30" rx="8" fill="#5B8CFF"/>
    <text x="15" y="19" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">C</text>
    <text x="42" y="20" font-size="22" font-weight="500" fill="#9FB4E8">A Cloudzy company</text>
  </g>
  <!-- rack motif -->
  <g transform="translate(900,150)" opacity="0.92">
    <rect x="0" y="0" width="220" height="330" rx="16" fill="#101216" stroke="#2A2D32"/>
    <g>
      <rect x="18" y="24" width="184" height="40" rx="6" fill="#0E1014" stroke="#1A1D22"/>
      <circle cx="34" cy="44" r="5" fill="#49C46D"/>
      <rect x="18" y="78" width="184" height="40" rx="6" fill="#0E1014" stroke="#1A1D22"/>
      <circle cx="34" cy="98" r="5" fill="#49C46D"/>
      <rect x="18" y="132" width="184" height="40" rx="6" fill="#0E1014" stroke="#1A1D22"/>
      <circle cx="34" cy="152" r="5" fill="#F4C430"/>
      <rect x="18" y="186" width="184" height="40" rx="6" fill="#0E1014" stroke="#1A1D22"/>
      <circle cx="34" cy="206" r="5" fill="#49C46D"/>
      <rect x="18" y="240" width="184" height="40" rx="6" fill="#0E1014" stroke="#1A1D22"/>
      <circle cx="34" cy="260" r="5" fill="#49C46D"/>
    </g>
  </g>
</svg>
